org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# Sahne arayüzü Jetpack Compose (AndroidX) ile yazılıyor; eski ekranlar platform View'larıyla kalır.
# Jetifier kapalı: AndroidX öncesi destek kitaplığına bağlı bağımlılık yok (JNA, OkHttp).
android.useAndroidX=true
kotlin.code.style=official
# Derlenecek ABI'ler (virgülle). Telefon için arm64-v8a yeterli; emülatör için
# komut satırında: -Pajanda.abiler=arm64-v8a,x86_64
ajanda.abiler=arm64-v8a
