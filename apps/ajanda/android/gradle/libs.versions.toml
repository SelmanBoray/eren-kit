# Sürüm kataloğu. Seçim ölçüsü: AGP 8.13 + compileSdk 36 + Kotlin 2.2.20 ile derlenebilen en yeni kararlı sürüm.
# - Compose BOM 2026.06.01 = Compose 1.11.4 (aar: minCompileSdk 35, AGP >= 8.6; Kotlin üst verisi 2.1).
#   Compose 1.12+ compileSdk 37 ve AGP 9.1 istiyor; o geçiş ayrı bir iş.
# - Compose derleyici eklentisi Kotlin sürümüyle aynı olmak zorunda.
# - Robolectric 4.17: Android 15 (SDK 35) çalışma zamanı makinede hazır; testler @Config(sdk = [35]) ile ona sabit.
[versions]
agp = "8.13.0"
kotlin = "2.2.20"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
jna = "5.17.0"
okhttp = "4.12.0"
junit = "4.13.2"
robolectric = "4.17"
roborazzi = "1.75.0"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
