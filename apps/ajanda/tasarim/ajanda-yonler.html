<title>Ajanda Yönleri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap">
<style>
/* Yerleşim: üstte yön seçici, altında tek telefon çerçevesi; üç yön aynı veriyi kendi belirteç takımıyla çizer. */
:root{
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
  --f-c:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-s:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-t:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --f-tm:"Barlow",system-ui,sans-serif;

  /* kabuk */
  --k-bg:#DDE0DC; --k-fg:#151917; --k-soft:#56605A; --k-line:#BCC3BD; --k-yuz:#F5F6F4; --k-golge:rgba(21,25,23,.45);
  /* cetvel: çizim kâğıdı, grafit, mezura sarısı */
  --c-bg:#EFF2EC; --c-yuz:#FBFCFA; --c-ink:#17201B; --c-soft:#66716A; --c-line:#C6CEC6;
  --c-sari:#F7C600; --c-sari-ust:#1C1A05; --c-mark:#0C6A59; --c-perde:rgba(23,32,27,.38);
  /* sahne: galeri duvarı; rengi levhalar taşır */
  --s-bg:#FFFFFF; --s-yuz:#F1F1F3; --s-ink:#14151A; --s-soft:#676A74; --s-line:#E2E3E7;
  --s-vurgu:#FFC83D; --s-vurgu-ust:#1A1505; --s-perde:rgba(20,21,26,.5);
  --foto-ust:#FFFFFF; --foto-perde:rgba(8,9,12,.62);
  /* levha takımları: b zemin, f figür, d koyu ayrıntı, l açık ayrıntı, i zemin üstü yazı */
  --kobalt-b:#2B50E0; --kobalt-f:#FFC83D; --kobalt-d:#0F1E5E; --kobalt-l:#DDE7FF; --kobalt-i:#FFFFFF;
  --cam-b:#0F6B4F; --cam-f:#F7B8C6; --cam-d:#06382A; --cam-l:#F6F1E3; --cam-i:#FFFFFF;
  --hardal-b:#F2B632; --hardal-f:#D8432B; --hardal-d:#3B2A05; --hardal-l:#FFF4D2; --hardal-i:#201703;
  --pembe-b:#F4A9BC; --pembe-f:#FFFFFF; --pembe-d:#5C1730; --pembe-l:#FFE3EA; --pembe-i:#3A0B1A;
  --domates-b:#C93A22; --domates-f:#F3D3A0; --domates-d:#5B140A; --domates-l:#FFE8D6; --domates-i:#FFFFFF;
  --gok-b:#BFE3EC; --gok-f:#1A8494; --gok-d:#0B3A42; --gok-l:#FFFFFF; --gok-i:#0B2A30;
  --kum-b:#E4DFD2; --kum-f:#2B50E0; --kum-d:#2A2618; --kum-l:#FFFFFF; --kum-i:#1C1A14;
  --gece-b:#1E2A3A; --gece-f:#F2B632; --gece-d:#0B121C; --gece-l:#C9D6E8; --gece-i:#FFFFFF;
  /* tabela: alüminyum pano, koyu kanatlar, durum lambaları */
  --t-bg:#D9DDE1; --t-yuz:#F3F5F6; --t-ink:#0F1418; --t-soft:#535E67; --t-line:#B9C0C6;
  --t-kanat:#12181D; --t-kanat-yazi:#F3EFE4; --t-yarik:#000000;
  --t-mavi:#1846C7; --t-amber:#D98200; --t-yesil:#1B8A51; --t-perde:rgba(15,20,24,.45);
  /* ortak */
  --isik-bg:#0A0B0C; --isik-fg:#F4F4F2;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --k-bg:#0B0D0C; --k-fg:#E9EDEA; --k-soft:#98A39C; --k-line:#2A312D; --k-yuz:#1B201D; --k-golge:rgba(0,0,0,.8);
  --c-bg:#111614; --c-yuz:#1A211E; --c-ink:#E8EEE9; --c-soft:#8E9A93; --c-line:#2C3631;
  --c-sari:#F7C600; --c-sari-ust:#1C1A05; --c-mark:#5CCDB6; --c-perde:rgba(0,0,0,.55);
  --s-bg:#0E0E11; --s-yuz:#1C1C21; --s-ink:#F5F3EE; --s-soft:#9C9EA8; --s-line:#2B2C33;
  --s-vurgu:#FFC83D; --s-vurgu-ust:#1A1505; --s-perde:rgba(0,0,0,.6);
  --kobalt-b:#2747CC; --cam-b:#0D5F46; --hardal-b:#E3A822; --pembe-b:#E79AAE; --domates-b:#B93520;
  --gok-b:#A9D3DD; --kum-b:#D2CCBD; --gece-b:#243347;
  --t-bg:#0C0F12; --t-yuz:#151A1F; --t-ink:#EEEAE0; --t-soft:#8B959D; --t-line:#262D34;
  --t-kanat:#222A32; --t-kanat-yazi:#F3EFE4; --t-yarik:#000000;
  --t-mavi:#86A9FF; --t-amber:#FFB32E; --t-yesil:#4CCB86; --t-perde:rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --k-bg:#0B0D0C; --k-fg:#E9EDEA; --k-soft:#98A39C; --k-line:#2A312D; --k-yuz:#1B201D; --k-golge:rgba(0,0,0,.8);
  --c-bg:#111614; --c-yuz:#1A211E; --c-ink:#E8EEE9; --c-soft:#8E9A93; --c-line:#2C3631;
  --c-sari:#F7C600; --c-sari-ust:#1C1A05; --c-mark:#5CCDB6; --c-perde:rgba(0,0,0,.55);
  --s-bg:#0E0E11; --s-yuz:#1C1C21; --s-ink:#F5F3EE; --s-soft:#9C9EA8; --s-line:#2B2C33;
  --s-vurgu:#FFC83D; --s-vurgu-ust:#1A1505; --s-perde:rgba(0,0,0,.6);
  --kobalt-b:#2747CC; --cam-b:#0D5F46; --hardal-b:#E3A822; --pembe-b:#E79AAE; --domates-b:#B93520;
  --gok-b:#A9D3DD; --kum-b:#D2CCBD; --gece-b:#243347;
  --t-bg:#0C0F12; --t-yuz:#151A1F; --t-ink:#EEEAE0; --t-soft:#8B959D; --t-line:#262D34;
  --t-kanat:#222A32; --t-kanat-yazi:#F3EFE4; --t-yarik:#000000;
  --t-mavi:#86A9FF; --t-amber:#FFB32E; --t-yesil:#4CCB86; --t-perde:rgba(0,0,0,.6);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--k-bg);color:var(--k-fg);font:15px/1.4 var(--f-c);overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{font:inherit;color:inherit}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
:focus-visible{outline:2px solid var(--odak,var(--k-fg));outline-offset:2px}
[hidden]{display:none!important}
.gizli-yazi{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.kabuk{height:100%;display:flex;flex-direction:column}
.ust{flex:none;display:flex;align-items:center;gap:8px;padding:8px var(--gr) 6px var(--gl)}
.yonler{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);position:relative;background:var(--k-yuz);border-radius:9px;padding:3px}
.yonler i{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);background:var(--k-fg);border-radius:7px;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.yonler[data-y="sahne"] i{transform:translateX(100%)}
.yonler[data-y="tabela"] i{transform:translateX(200%)}
.yonler button{position:relative;z-index:1;height:38px;text-align:center;font-weight:600;font-stretch:88%;font-size:15px;transition:color .2s;white-space:nowrap}
.yonler button[aria-selected="true"]{color:var(--k-yuz)}
.arac{flex:none;width:40px;height:44px;border-radius:9px;background:var(--k-yuz);display:grid;place-items:center}
.arac svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.alan{flex:1;min-height:0;display:flex;flex-direction:column}
.kunye{flex:none;padding:0 var(--gr) 8px var(--gl);font-size:13.5px;line-height:1.35;color:var(--k-soft)}
.kunye h2{display:none;font-size:44px;line-height:1;font-weight:700;font-stretch:75%;color:var(--k-fg);letter-spacing:-.01em}
.kunye-fikir{color:var(--k-fg)}
.kunye-ac{font-weight:600;text-decoration:underline;text-underline-offset:2px;color:var(--k-fg);min-height:28px;margin-left:4px}
.kunye-ek{display:none;margin-top:8px}
.kunye.acik .kunye-ek{display:grid;gap:8px}
.kunye-ek dt{font-weight:650;color:var(--k-fg);font-stretch:88%}
.kunye-ek dd{margin:0}
.kunye-ek dl{margin:0;display:grid;gap:8px}
.kunye-oneri{border-top:1px solid var(--k-line);padding-top:8px;color:var(--k-fg)}
.kunye-sifir{font-weight:600;text-decoration:underline;text-underline-offset:2px;color:var(--k-fg);min-height:32px;justify-self:start}
.telefon{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:18px 18px 0 0}
.app{position:absolute;inset:0;overflow:hidden;isolation:isolate;user-select:none;-webkit-user-select:none}
.app input{user-select:text;-webkit-user-select:text}

@media (min-width:860px){
  .ust{justify-content:center;padding-top:14px}
  .yonler{flex:none;width:420px}
  .alan{flex-direction:row;justify-content:center;align-items:center;gap:56px;padding:8px 32px 20px}
  .kunye{width:330px;padding:0;font-size:15px;line-height:1.45}
  .kunye h2{display:block;margin-bottom:12px}
  .kunye-fikir{font-size:17px;line-height:1.4}
  .kunye-ek{display:grid;gap:12px;margin-top:16px}
  .kunye-ek dl{gap:12px}
  .kunye-ac{display:none}
  .kunye-oneri{padding-top:12px}
  .telefon{flex:none;width:392px;height:min(820px,100%);border-radius:36px;border:1px solid var(--k-line);--gl:18px;--gr:18px;box-shadow:0 34px 60px -34px var(--k-golge)}
}

/* ortak parçalar */
.ft{display:block;width:100%;height:100%;object-fit:cover}
.ik{width:1em;height:1em;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tost{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:70;background:var(--tb);color:var(--tf);padding:10px 14px;font-size:14px;font-weight:500;display:flex;gap:14px;align-items:center;width:max-content;max-width:calc(100% - 32px);border-radius:var(--tr,6px)}
.tost button{font-weight:700;text-decoration:underline;text-underline-offset:2px;min-height:32px;flex:none}
.isik{position:absolute;inset:0;z-index:80;background:var(--isik-bg);color:var(--isik-fg);display:grid;place-items:center;padding:16px}
.isik-ic{width:100%;max-width:520px;aspect-ratio:4/3;border-radius:6px;overflow:hidden}
.isik-kapat{position:absolute;top:12px;right:var(--gr);width:44px;height:44px;display:grid;place-items:center;font-size:24px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important;scroll-behavior:auto!important}
  .s-halka{opacity:.3}
}

/* ============ CETVEL ============ */
.d-cetvel{--odak:var(--c-mark);--tb:var(--c-ink);--tf:var(--c-bg);--tr:2px;background:var(--c-bg);color:var(--c-ink);font-family:var(--f-c);font-size:15px}
.c-ekran{position:absolute;inset:0;display:flex;flex-direction:column}
.c-bas{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:16px var(--gr) 12px var(--gl);border-bottom:1px solid var(--c-ink)}
.c-tarih{display:flex;align-items:flex-end;gap:10px;min-width:0}
.c-no{display:flex;font-size:78px;line-height:.78;height:.78em;font-weight:700;font-stretch:62%;font-variant-numeric:tabular-nums;overflow:hidden}
.c-no span{display:block}
.c-aygun{display:flex;flex-direction:column;line-height:1.15;padding-bottom:1px;min-width:0}
.c-aygun b{font-size:21px;font-weight:650;font-stretch:85%}
.c-aygun span{color:var(--c-soft);font-size:14px}
.c-gecis{flex:none;display:flex;border:1px solid var(--c-ink);border-radius:3px;position:relative;overflow:hidden}
.c-gecis i{position:absolute;inset:0 50% 0 0;background:var(--c-ink);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.c-gecis[data-g="takvim"] i{transform:translateX(100%)}
.c-gecis button{position:relative;z-index:1;width:52px;height:40px;text-align:center;font-weight:600;font-stretch:88%;transition:color .2s}
.c-gecis button[aria-pressed="true"]{color:var(--c-bg)}

.c-govde{flex:1;min-height:0;position:relative}
.c-gun,.c-ay{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain}
.c-boyu{padding:10px var(--gr) 0 var(--gl);display:grid;gap:2px}
.c-boyu .c-l{border-bottom:1px solid var(--c-line)}
.c-cetvel{position:relative;margin:22px 0 40px}
.c-gecmis{position:absolute;left:0;right:0;top:-22px;pointer-events:none;background:repeating-linear-gradient(-45deg,transparent 0 7px,var(--c-line) 7px 8px);opacity:.3}
.c-olcek{position:absolute;left:var(--gl);top:0;bottom:0;width:44px;pointer-events:none;
  background:
    linear-gradient(var(--c-ink),var(--c-ink)) right top/1px 100% no-repeat,
    repeating-linear-gradient(to bottom,var(--c-ink) 0 1px,transparent 1px 60px) right top/14px 100% no-repeat,
    repeating-linear-gradient(to bottom,var(--c-soft) 0 1px,transparent 1px 15px) right top/7px 100% no-repeat}
.c-sa{position:absolute;left:0;width:24px;text-align:right;font-stretch:62%;font-weight:600;font-size:20px;line-height:1;margin-top:-10px;font-variant-numeric:tabular-nums}
.c-sure{position:absolute;left:calc(var(--gl) + 41px);width:6px;background:var(--c-mark);transform-origin:top}
.c-bant{position:absolute;left:calc(var(--gl) + 51px);width:0;border-left:2px dotted var(--c-soft)}
.c-bant::before,.c-bant::after{content:"";position:absolute;left:-2px;width:8px;border-top:2px dotted var(--c-soft)}
.c-bant::before{top:0}.c-bant::after{bottom:0}
.c-simdi{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--c-sari);z-index:3;pointer-events:none}
.c-simdi span{position:absolute;left:var(--gl);top:-12px;background:var(--c-sari);color:var(--c-sari-ust);font-weight:700;font-stretch:75%;font-size:13px;line-height:22px;padding:0 6px;white-space:nowrap}
.c-bos{position:absolute;left:calc(var(--gl) + 66px);right:var(--gr);color:var(--c-soft)}

.c-k{position:absolute;left:calc(var(--gl) + 44px);right:calc(var(--gr) - 10px);display:flex;align-items:flex-start;min-height:44px;z-index:2}
.c-k-im{flex:none;width:20px;height:44px;position:relative}
.c-k-im::before{content:"";position:absolute;left:0;right:5px;top:50%;margin-top:-1px;border-top:2px solid var(--c-ink);transform-origin:left}
.c-k.bolumlu .c-k-im::before,.c-k.taslak .c-k-im::before{border-top-style:dotted;border-top-color:var(--c-soft)}
.c-k-sim{flex:none;width:26px;height:44px;display:grid;place-items:center;font-size:22px}
.c-k-ad{flex:1;min-width:0;min-height:44px;display:flex;flex-direction:column;justify-content:center;padding:3px 6px 3px 4px;gap:1px}
.c-k > .c-k-ad{justify-content:flex-start;padding-top:11px}
.c-k-b{font-weight:600;font-size:17px;line-height:1.2}
.c-k-b b,.c-a-ad span{font-weight:inherit;background:linear-gradient(currentColor,currentColor) no-repeat 0 56%/0% 1.5px;transition:background-size .42s cubic-bezier(.3,.7,.2,1)}
.bitti .c-k-b b,.c-a-ad.bitti span{background-size:100% 1.5px}
.bitti .c-k-ad,.bitti .c-k-sim{color:var(--c-soft)}
.c-k-ad small{font-size:13px;color:var(--c-soft);font-stretch:90%;line-height:1.25}
.c-k.taslak .c-k-b,.c-k.taslak .c-k-sim{color:var(--c-soft)}
.c-k-foto{flex:none;width:34px;height:34px;margin:5px 0;border-radius:2px;overflow:hidden}
.c-k-tik{flex:none;width:44px;height:44px;display:grid;place-items:center}
.c-k-tik i{width:22px;height:22px;border:1.5px solid var(--c-ink);border-radius:2px;display:grid;place-items:center;transition:background-color .18s}
.c-k-tik svg{width:16px;height:16px;fill:none;stroke:var(--c-bg);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .28s .08s}
.bitti .c-k-tik i{background:var(--c-ink)}
.bitti .c-k-tik svg{stroke-dashoffset:0}
.c-k-onay{display:flex;gap:6px;margin-top:5px}
.c-k-onay button{height:34px;padding:0 12px;border:1px solid var(--c-ink);border-radius:2px;font-weight:600;font-size:14px;font-stretch:90%;color:var(--c-ink)}
.c-k-onay button[data-a="onayla"]{background:var(--c-ink);color:var(--c-bg)}

.c-alt{flex:none;display:flex;border-top:1px solid var(--c-ink);background:var(--c-bg);position:relative;z-index:5}
.c-cep{flex:1;min-width:0;height:56px;padding:0 0 0 var(--gl);display:flex;align-items:center;gap:8px;font-weight:600;font-stretch:90%}
.c-cep .ik{font-size:20px}
.c-cep small{font-weight:400;color:var(--c-soft);font-size:14px}
.c-ekle{flex:none;height:56px;padding:0 var(--gr) 0 18px;display:flex;align-items:center;gap:8px;background:var(--c-sari);color:var(--c-sari-ust);font-weight:700;font-stretch:88%}
.c-ekle .ik{font-size:20px;stroke-width:2.2}

/* ay */
.c-ay{padding:14px var(--gr) 30px var(--gl)}
.c-ay-bas{display:flex;align-items:center;justify-content:space-between}
.c-ay-ad{font-size:26px;font-weight:680;font-stretch:78%}
.c-ay-ad span{color:var(--c-soft);font-weight:400}
.c-ay-ok{display:flex}
.c-ay-ok button{width:44px;height:44px;display:grid;place-items:center;font-size:22px}
.c-ay-gunler{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;color:var(--c-soft);margin-top:6px;padding-bottom:4px}
.c-ay-gunler span{padding-left:4px}
.c-izgara{display:grid;grid-template-columns:repeat(7,1fr);position:relative;border-top:1px solid var(--c-ink);touch-action:pan-y}
.c-h{aspect-ratio:1/1.02;border-bottom:1px solid var(--c-line);padding:6px 3px 0 4px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0}
.c-h b{font-stretch:62%;font-size:21px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;padding:1px 3px;margin:-1px -3px}
.c-h.dis b{color:var(--c-soft);font-weight:400;opacity:.6}
.c-h.bugun b{background:var(--c-sari);color:var(--c-sari-ust)}
.c-h .im{display:flex;flex-direction:column;gap:2px;width:100%}
.c-h .im i{height:0;width:72%;border-top:2px solid var(--c-ink)}
.c-h .im i.b{border-top-color:var(--c-soft);opacity:.45}
.c-h .im i.t{border-top-style:dotted;border-top-color:var(--c-soft)}
.c-h .im i.uz{width:calc(100% + 4px);border-top-color:var(--c-mark);border-top-width:3px}
.c-sec{position:absolute;left:0;top:0;border:2px solid var(--c-ink);pointer-events:none;transition:transform .36s cubic-bezier(.2,.8,.2,1)}
.c-ay-liste{margin-top:14px}
.c-l-bas{font-size:15px;font-weight:650;font-stretch:88%;display:flex;justify-content:space-between;padding-bottom:6px;border-bottom:1px solid var(--c-ink)}
.c-l-bas span{font-weight:400;color:var(--c-soft)}
.c-l{display:flex;align-items:flex-start;min-height:48px;border-bottom:1px solid var(--c-line)}
.c-l-z{flex:none;width:58px;padding-top:13px;font-stretch:68%;font-weight:600;font-size:17px;line-height:1.2;font-variant-numeric:tabular-nums}
.c-l-z.yumusak{font-size:14px;font-stretch:80%;font-weight:500;color:var(--c-soft);padding-top:15px}
.c-l .c-k-ad{min-height:48px}
.c-l-bos{padding:14px 0;color:var(--c-soft)}

.c-a-ic{flex:1;min-height:0;overflow-y:auto;padding:6px var(--gr) 24px var(--gl);display:flex;flex-direction:column;gap:20px}

.c-a-bolge{display:grid;gap:4px;font-size:15px}

.c-a-not{font-size:16px;line-height:1.5;max-width:36em;user-select:text;-webkit-user-select:text}
.c-a-fotolar{display:flex;gap:8px;overflow-x:auto;margin:0 calc(-1*var(--gr)) 0 0;padding-right:var(--gr)}
.c-a-fotolar > *{flex:none;width:132px;height:99px;border-radius:2px;overflow:hidden}
.c-a-fekle{border:1px dashed var(--c-ink);display:grid;place-items:center;align-content:center;gap:4px;font-size:13px;font-weight:600;text-align:center}

.c-a-liste li{border-top:1px solid var(--c-line)}

.c-a-liste button,.c-a-liste .sat{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;font-size:16px}

.c-a-alt{flex:none;padding:10px var(--gr) 12px var(--gl);border-top:1px solid var(--c-ink);background:var(--c-yuz)}

/* alt kâğıtlar: cep ve yeni kayıt */
.c-perde{position:absolute;inset:0;z-index:30;background:var(--c-perde)}
.c-kagit{position:absolute;left:0;right:0;bottom:0;z-index:31;max-height:86%;background:var(--c-yuz);border-top:2px solid var(--c-ink);display:flex;flex-direction:column}
.c-tutamak{flex:none;height:28px;display:grid;place-items:center;touch-action:none;cursor:grab}

.c-kagit-ic{overflow-y:auto;padding:0 var(--gr) 18px var(--gl)}
.c-kagit h2{font-size:24px;font-weight:680;font-stretch:78%;margin-bottom:10px}
.c-yeni label{display:block;font-size:13px;color:var(--c-soft);font-weight:600;margin-bottom:4px}
.c-yeni input{width:100%;height:48px;border:0;border-bottom:2px solid var(--c-ink);background:none;font-size:20px;font-weight:600;font-stretch:88%;padding:0;border-radius:0;outline:none}

.c-tur{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border:1px solid var(--c-ink);border-radius:3px;position:relative;overflow:hidden}

.c-tur[data-t="tarihsiz"] i{transform:translateX(200%)}

.c-tur button[aria-checked="true"]{color:var(--c-yuz)}
.c-tur-ic{margin-top:14px;min-height:118px}
.c-okuma{display:block;font-size:46px;line-height:1;font-weight:700;font-stretch:62%;font-variant-numeric:tabular-nums;text-align:center}
.c-mezura{position:relative;margin:8px calc(-1*var(--gr)) 0 calc(-1*var(--gl));height:58px;background:var(--c-sari);color:var(--c-sari-ust)}

.c-mezura-kay::before,.c-mezura-kay::after{content:"";flex:none;width:calc(50% - 9px)}
.c-mz{flex:none;width:18px;scroll-snap-align:center;position:relative}
.c-mz::before{content:"";position:absolute;left:8.5px;top:0;height:10px;border-left:1px solid currentColor}
.c-mz.s::before{height:22px;border-left-width:2px;left:8px}
.c-mz span{position:absolute;left:9px;top:28px;transform:translateX(-50%);font-stretch:62%;font-weight:700;font-size:18px;line-height:1;font-variant-numeric:tabular-nums}
.c-mezura::after{content:"";position:absolute;left:50%;top:-6px;bottom:-6px;width:2px;margin-left:-1px;background:var(--c-ink);pointer-events:none}
.c-yongalar{display:flex;flex-wrap:wrap;gap:6px}
.c-yongalar button{height:42px;padding:0 13px;border:1px solid var(--c-ink);border-radius:2px;font-weight:600;font-stretch:90%}
.c-yongalar button[aria-checked="true"]{background:var(--c-ink);color:var(--c-yuz)}
.c-tur-ic p{color:var(--c-soft);max-width:30em}
.c-kaydet{width:100%;height:50px;margin-top:14px;background:var(--c-ink);color:var(--c-yuz);font-weight:650;font-size:16px;text-align:center;border-radius:2px}
.c-cep-liste .c-l:first-child{border-top:1px solid var(--c-ink)}

/* ============ SAHNE ============ */
.d-sahne{--odak:var(--s-ink);--tb:var(--s-ink);--tf:var(--s-bg);--tr:999px;background:var(--s-bg);color:var(--s-ink);font-family:var(--f-s);font-size:16px}
.r-kobalt{--pb:var(--kobalt-b);--pf:var(--kobalt-f);--pd:var(--kobalt-d);--pl:var(--kobalt-l);--pi:var(--kobalt-i)}
.r-cam{--pb:var(--cam-b);--pf:var(--cam-f);--pd:var(--cam-d);--pl:var(--cam-l);--pi:var(--cam-i)}
.r-hardal{--pb:var(--hardal-b);--pf:var(--hardal-f);--pd:var(--hardal-d);--pl:var(--hardal-l);--pi:var(--hardal-i)}
.r-pembe{--pb:var(--pembe-b);--pf:var(--pembe-f);--pd:var(--pembe-d);--pl:var(--pembe-l);--pi:var(--pembe-i)}
.r-domates{--pb:var(--domates-b);--pf:var(--domates-f);--pd:var(--domates-d);--pl:var(--domates-l);--pi:var(--domates-i)}
.r-gok{--pb:var(--gok-b);--pf:var(--gok-f);--pd:var(--gok-d);--pl:var(--gok-l);--pi:var(--gok-i)}
.r-kum{--pb:var(--kum-b);--pf:var(--kum-f);--pd:var(--kum-d);--pl:var(--kum-l);--pi:var(--kum-i)}
.r-gece{--pb:var(--gece-b);--pf:var(--gece-f);--pd:var(--gece-d);--pl:var(--gece-l);--pi:var(--gece-i)}

.rs{display:block;width:100%;height:100%;overflow:visible}
.rs *{transition:fill-opacity .6s .15s,stroke-opacity .4s}
.rs .pf{fill:var(--pf)}.rs .pl{fill:var(--pl)}.rs .pd{fill:var(--pd)}.rs .pb2{fill:var(--pb);opacity:.45}
.rs .ps{fill:none;stroke:var(--pd);stroke-width:4;stroke-linecap:round;opacity:.22}
.rs .ps2{fill:none;stroke:var(--pd);stroke-width:7;stroke-linecap:round}
.rs .ps3{fill:none;stroke:var(--pl);stroke-width:4;stroke-linecap:round;opacity:.55}
.rs-zemin{fill:var(--pd);opacity:.28}
.rs-kopuk circle{fill:var(--pl);opacity:.92}
.rs-imza-cizgi{fill:none;stroke:var(--pd);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:0}
.canli .rs-imza-cizgi{animation:s-imza 1.5s .5s cubic-bezier(.5,0,.3,1) both}
.canli .rs-kalem{animation:s-kalem 1.5s .5s cubic-bezier(.5,0,.3,1) both}
@keyframes s-imza{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes s-kalem{from{transform:translate(-60px,9px)}35%{transform:translate(-38px,-4px)}70%{transform:translate(-16px,5px)}to{transform:none}}
.canli .rs-kopuk circle{animation:s-kopuk 3.2s ease-in-out infinite}
.canli .rs-kopuk circle:nth-child(2){animation-delay:-.8s}.canli .rs-kopuk circle:nth-child(3){animation-delay:-1.7s}.canli .rs-kopuk circle:nth-child(4){animation-delay:-2.3s}.canli .rs-kopuk circle:nth-child(5){animation-delay:-1.1s}
@keyframes s-kopuk{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.canli .rs-buhar{animation:s-buhar 2.8s ease-in-out infinite}
@keyframes s-buhar{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-6px);opacity:.5}}
.canli .rs-pirilti{transform-box:fill-box;transform-origin:center;animation:s-pirilti 2.6s ease-in-out infinite}
@keyframes s-pirilti{0%,100%{transform:scale(1)}50%{transform:scale(.6) rotate(20deg)}}
.patla .rs-kopuk circle{transform-box:fill-box;transform-origin:center;animation:s-patla .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes s-patla{40%{transform:scale(1.9);opacity:.9}to{transform:scale(2.6);opacity:0}}

.s-ekran{position:absolute;inset:0;overflow:hidden}
.s-sayfa{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:20px var(--gr) 120px var(--gl)}
.s-bas{padding:4px 2px 18px}
.s-tarih{font-size:15px;color:var(--s-soft);font-weight:500}

.s-mozaik{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.s-p::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--pb);clip-path:circle(150% at 82% 84%);transition:clip-path .8s cubic-bezier(.3,.7,.2,1)}
.s-p--buyuk{grid-column:1/-1;aspect-ratio:1/.84}
.s-p--kare{aspect-ratio:1/1.2}
.s-p--genis{grid-column:1/-1;aspect-ratio:1/.52}

.s-p-resim{position:absolute;inset:7% 9% 30% 9%;pointer-events:none}

.s-p--serit .s-p-resim{inset:20% 6% 32% 6%}

.s-tik{position:absolute;right:12px;bottom:12px;width:46px;height:46px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;transition:background-color .2s}

.s-tik.oldu,.bitti .s-tik{background:currentColor}
.s-tik.oldu svg,.bitti .s-tik svg{stroke-dashoffset:0}
.s-p.yikaniyor::after{content:"";position:absolute;top:-20%;bottom:-20%;left:0;width:55%;background:var(--pl);opacity:.5;transform:translateX(-140%) skewX(-18deg);animation:s-yika .7s cubic-bezier(.4,0,.2,1) both;pointer-events:none}
@keyframes s-yika{to{transform:translateX(260%) skewX(-18deg)}}

.s-a-kapak{position:relative;height:46%;min-height:260px;background:var(--pb);color:var(--pi);border-radius:0 0 34px 34px;overflow:hidden;touch-action:pan-x;cursor:grab}

    const mv = (ev) => {
      const dx = ev.clientX - x0, dy = ev.clientY - y0;
      if (!aktif) {
        if (Math.hypot(dx, dy) < 8) return;
        if (h.eksen === 'x' && Math.abs(dx) < Math.abs(dy)) return birak();
        if (h.eksen === 'y' && Math.abs(dy) < Math.abs(dx)) return birak();
        aktif = true;
        try { hedef.setPointerCapture(e.pointerId); } catch (_) {}

      }
      const dt = Math.max(1, ev.timeStamp - son.t);

      son = { x: ev.clientX, y: ev.clientY, t: ev.timeStamp };
      h.tasi(dx, dy, ev);
    };
    const up = (ev) => {
      birak();
      if (!aktif) return;
      hedef._surukledi = true; setTimeout(() => { hedef._surukledi = false; }, 60);
      h.bitir(ev.clientX - x0, ev.clientY - y0, v.x, v.y, ev);
    };

  });
}
