name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bellek:
    name: bellek
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/bellek
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/bellek/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  # kapı ve devir hook'ları kullanıcının sistem Python'uyla çalışır (3.12 ve 3.14 uyumlu olmalı);
  # tam paket 3.12'de (yukarıda) koşar, burada yalnız hook testleri 3.14'te.
  bellek-hooks-py314:
    name: bellek hook'ları (Python 3.14)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/bellek
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: pip
          cache-dependency-path: packages/bellek/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test (kapi + devir)
        run: python -m pytest -q tests/kapi tests/devir

  opus-orkestra:
    name: opus-orkestra
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/opus-orkestra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install pytest
      - name: Test
        run: python -m pytest -q tests

  computer-use-windows:
    name: computer-use-windows (Python ${{ matrix.python-version }}${{ matrix.mcp != 'latest' && format(', mcp {0}', matrix.mcp) || '' }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        mcp: ["latest"]
        # Existing installs keep mcp 1.x (pyproject allows >=1.30.0,<3): one extra job keeps
        # the lowest supported SDK working.
        include:
          - python-version: "3.11"
            mcp: "1.30.0"
    defaults:
      run:
        working-directory: packages/computer-use-windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: packages/computer-use-windows/pyproject.toml
      - name: Install
        env:
          MCP_VERSION: ${{ matrix.mcp }}
        run: |
          $pin = @(if ($env:MCP_VERSION -ne 'latest') { "mcp==$env:MCP_VERSION" })
          python -m pip install -e ".[dev]" @pin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip show mcp
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      # pyproject addopts already deselects integration tests (-m "not integration")
      - name: Test
        run: pytest -q

  phone:
    name: phone
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/phone
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          # kök (protocol + server + kurulum) ve app/ ayrı kilit dosyalarıyla kurulur
          cache-dependency-path: |
            apps/phone/package-lock.json
            apps/phone/app/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck (protocol)
        run: npm run typecheck:protocol
      - name: Test (protocol)
        run: npm run test:protocol
      - name: Typecheck (server)
        run: npm run typecheck -w server
      # dis-dunya.test.ts de dahil; CI'da canlı servis olmadığı için tekil boru çakışması yok
      - name: Test (server)
        run: npm test -w server
      - name: Install (app)
        working-directory: apps/phone/app
        run: npm ci
      - name: Typecheck (app)
        working-directory: apps/phone/app
        run: |
          npx tsc --noEmit -p tsconfig.json
          npx tsc --noEmit -p tsconfig.test.json
      - name: Test (app)
        working-directory: apps/phone/app
        run: node --test "test/**/*.test.ts"
      - name: Typecheck (kurulum)
        run: npx tsc --noEmit -p kurulum/tsconfig.json
      - name: Test (kurulum)
        run: node --disable-warning=ExperimentalWarning --test "kurulum/test/**/*.test.ts"

  # Saf JVM (Android eklentisi yok): ayrı iş, Node/npm gerekmez, linux runner'da Gradle
  # önbelleği ve JDK kurulumu daha hızlı. Testler yalnız repo içi dosyaları (protocol/) okur.
  phone-cekirdek:
    name: phone-cekirdek
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/phone/app/modules/eren-device/cekirdek
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      # validate-wrappers bu sürümde zaten varsayılan true; gradle-wrapper.jar'ın resmi sağlama
      # toplamıyla eşleşmesi (fork PR'ı jar'ı değiştirebilir) sürüm yükseltmelerinde de açık kalsın diye yazılı.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
      # git yürütme biti kaybolmuş olabilir (Windows'ta eklenen dosya); her durumda güvenli
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Test
        run: ./gradlew test --no-daemon --console=plain

  # Gizlilik kapısı: izlenen dosyalarda kişisel yol / e-posta / belirteç / büyük ikili arar
  # (çıkış 1 = bulgu, 2 = hata; ikisi de işi kırar). GIZLILIK_YASAK secret'ı tanımlı değilse ya da
  # fork/Dependabot PR'ında boş gelirse yasak sözcük kuralı çalışmaz, diğer kurallar yine çalışır.
  # Bu durum sessiz kalmasın diye son adım secret'ı denetler: PR'da uyarı (fork'lar secret alamaz,
  # kırılmaz), main'e push'ta hata (secret eksikse depo sahibi fark etsin). Değer hiçbir yerde
  # yazdırılmaz; yalnız boş olup olmadığına bakılır.
  gizlilik:
    name: gizlilik
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tara
        env:
          GIZLILIK_YASAK: ${{ secrets.GIZLILIK_YASAK }}
        run: python -B scripts/gizlilik_tara.py
      - name: Install
        run: python -m pip install pytest
      - name: Test (tarayıcı)
        run: python -m pytest -q scripts/tests
      # Önceki adımlar düşse de koşar (iptal hariç): secret eksikliği her koşuda görünür.
      - name: Yasak sözcük secret'ı denetimi
        if: ${{ !cancelled() }}
        env:
          GIZLILIK_YASAK: ${{ secrets.GIZLILIK_YASAK }}
          OLAY: ${{ github.event_name }}
          REF: ${{ github.ref }}
          FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ -n "$GIZLILIK_YASAK" ]; then
            echo "GIZLILIK_YASAK tanımlı: yasak sözcük kuralı etkin."
            exit 0
          fi
          mesaj="GIZLILIK_YASAK secret'ı boş: yasak sözcük (kişisel ad) kuralı bu koşuda ÇALIŞMADI."
          if [ "$OLAY" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            echo "::error title=Gizlilik::$mesaj Depo ayarlarında (Settings > Secrets and variables > Actions) GIZLILIK_YASAK secret'ını tanımla."
            echo "**Hata:** $mesaj main push'unda secret zorunlu." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$FORK_PR" = "true" ]; then
            ek="Fork PR'ları secret alamaz; merge etmeden önce yerelde tam tarama yap (python -B scripts/gizlilik_tara.py, GIZLILIK_YASAK ortamda)."
          else
            ek="Secret tanımlı değil ya da bu olay (ör. Dependabot PR'ı) secret almıyor; merge öncesi yerelde tam tarama yap."
          fi
          echo "::warning title=Gizlilik::$mesaj $ek"
          echo "**Uyarı:** $mesaj $ek" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- Windows kurulum
  installer-windows:
    name: install.ps1 (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install pytest
      # test_install_macos.py'deki bu 4 test macOS'a özgü (os.getuid, POSIX yol ayracı, Homebrew
      # yolu) ve Windows'ta düşer; burada seçiciyle dışarıda bırakılır. macOS işi klasörün
      # tamamını koşar.
      - name: Test
        run: >-
          python -m pytest -q scripts/installer/tests
          --deselect scripts/installer/tests/test_install_macos.py::test_plist_icerigi
          --deselect scripts/installer/tests/test_install_macos.py::test_servis_kurulum_launchctl_cagrilari
          --deselect scripts/installer/tests/test_install_macos.py::test_mcp_sahiplik_ve_esitlik
          --deselect scripts/installer/tests/test_install_macos.py::test_main_kapi_hook_yorumlayiciyla_ve_filtreyle_kaydolur
      # PowerShell 7 (pwsh) ve Windows PowerShell 5.1 (powershell) altında: -DryRun ve -Doctor
      # çıkış 0, verilen claude-home boş kalır, depoda dosya oluşmaz/değişmez. Boş claude-home'da
      # doktorun servis/ağ denetimleri "kurulu değil" döner; yine de --no-network ile ayrıca koşulur.
      - name: Dry run ve doktor (no changes)
        shell: pwsh
        run: |
          $baslangic = [DateTime]::UtcNow
          $durum = (git status --porcelain) -join "`n"
          foreach ($ps in 'pwsh', 'powershell') {
            $kok = Join-Path $env:RUNNER_TEMP "claude-$ps"
            New-Item -ItemType Directory -Path $kok -Force | Out-Null
            & $ps -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -DryRun -SkipMcp -NoService -SkipEnv -ClaudeHome $kok
            if ($LASTEXITCODE -ne 0) { throw "${ps}: install.ps1 -DryRun çıkış $LASTEXITCODE" }
            $kalan = @(Get-ChildItem -LiteralPath $kok -Force -Recurse)
            if ($kalan.Count -gt 0) { $kalan | ForEach-Object FullName; throw "${ps}: -DryRun claude-home'da dosya oluşturdu" }
            & $ps -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -Doctor -ClaudeHome $kok
            if ($LASTEXITCODE -ne 0) { throw "${ps}: install.ps1 -Doctor çıkış $LASTEXITCODE (boş claude-home'da 0 beklenir)" }
            $kalan = @(Get-ChildItem -LiteralPath $kok -Force -Recurse)
            if ($kalan.Count -gt 0) { $kalan | ForEach-Object FullName; throw "${ps}: -Doctor claude-home'da dosya oluşturdu" }
          }
          python -I -B scripts/installer/doktor.py --no-network --claude-home (Join-Path $env:RUNNER_TEMP 'claude-pwsh')
          if ($LASTEXITCODE -ne 0) { throw "doktor.py --no-network çıkış $LASTEXITCODE" }
          if (((git status --porcelain) -join "`n") -ne $durum) { git status --porcelain; throw 'dry-run/doktor sonrası git status değişti' }
          $yeni = @(Get-ChildItem -Recurse -Force -File | Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' -and $_.LastWriteTimeUtc -ge $baslangic })
          if ($yeni.Count -gt 0) { $yeni | ForEach-Object FullName; throw 'dry-run/doktor depoda dosya bıraktı ya da değiştirdi (__pycache__ vb.)' }
          Write-Host 'dry-run ve doktor: çıkış 0, claude-home boş, depo değişmedi'

  # ---------------------------------------------------------------- macOS
  bellek-macos:
    name: bellek (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/bellek
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/bellek/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  opus-orkestra-macos:
    name: opus-orkestra (macOS)
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/opus-orkestra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install pytest
      - name: Test
        run: python -m pytest -q tests

  installer-macos:
    name: install.sh (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install pytest
      - name: Test
        run: python -m pytest -q scripts/installer/tests
      # --dry-run hiçbir şey değiştirmemeli: claude-home oluşmaz, git status temiz kalır ve
      # depoda (yok sayılan __pycache__ dahil) yeni ya da değişmiş dosya olmaz.
      - name: Dry run (no changes)
        run: |
          isaret="$RUNNER_TEMP/dry-run-baslangic"
          touch "$isaret"
          ./install.sh --dry-run --skip-mcp --claude-home "$RUNNER_TEMP/claude" --components beyin,devir,kapi,orkestra,computer-use
          if [ -e "$RUNNER_TEMP/claude" ]; then
            echo "::error::--dry-run claude-home'u oluşturdu: $RUNNER_TEMP/claude"
            ls -laR "$RUNNER_TEMP/claude"
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::--dry-run sonrası git status temiz değil"
            git status --porcelain
            exit 1
          fi
          yeni="$(find . -path ./.git -prune -o -newer "$isaret" -print)"
          if [ -n "$yeni" ]; then
            echo "::error::--dry-run depoda dosya bıraktı ya da değiştirdi (__pycache__ vb.):"
            echo "$yeni"
            exit 1
          fi
          echo "dry-run: claude-home oluşmadı, depo değişmedi"
