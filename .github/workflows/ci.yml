name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bellek:
    name: bellek
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/bellek
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  opus-orkestra:
    name: opus-orkestra
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/opus-orkestra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install pytest
      - name: Test
        run: python -m pytest -q tests

  computer-use-windows:
    name: computer-use-windows (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: packages/computer-use-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      # pyproject addopts already deselects integration tests (-m "not integration")
      - name: Test
        run: pytest -q

  phone:
    name: phone
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/phone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/phone/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck (protocol)
        run: npm run typecheck:protocol
      - name: Test (protocol)
        run: npm run test:protocol
      - name: Typecheck (server)
        run: npm run typecheck -w server
      - name: Test (server)
        run: npm test -w server
