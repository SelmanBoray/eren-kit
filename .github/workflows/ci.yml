name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bellek:
    name: bellek
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/bellek
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  opus-orkestra:
    name: opus-orkestra
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/opus-orkestra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install pytest
      - name: Test
        run: python -m pytest -q tests

  computer-use-windows:
    name: computer-use-windows (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: packages/computer-use-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      # pyproject addopts already deselects integration tests (-m "not integration")
      - name: Test
        run: pytest -q

  phone:
    name: phone
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/phone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # kök (protocol + server + kurulum) ve app/ ayrı kilit dosyalarıyla kurulur
          cache-dependency-path: |
            apps/phone/package-lock.json
            apps/phone/app/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck (protocol)
        run: npm run typecheck:protocol
      - name: Test (protocol)
        run: npm run test:protocol
      - name: Typecheck (server)
        run: npm run typecheck -w server
      # dis-dunya.test.ts de dahil; CI'da canlı servis olmadığı için tekil boru çakışması yok
      - name: Test (server)
        run: npm test -w server
      - name: Install (app)
        working-directory: apps/phone/app
        run: npm ci
      - name: Typecheck (app)
        working-directory: apps/phone/app
        run: |
          npx tsc --noEmit -p tsconfig.json
          npx tsc --noEmit -p tsconfig.test.json
      - name: Test (app)
        working-directory: apps/phone/app
        run: node --test "test/**/*.test.ts"
      - name: Typecheck (kurulum)
        run: npx tsc --noEmit -p kurulum/tsconfig.json
      - name: Test (kurulum)
        run: node --disable-warning=ExperimentalWarning --test "kurulum/test/**/*.test.ts"

  # Saf JVM (Android eklentisi yok): ayrı iş, Node/npm gerekmez, linux runner'da Gradle
  # önbelleği ve JDK kurulumu daha hızlı. Testler yalnız repo içi dosyaları (protocol/) okur.
  phone-cekirdek:
    name: phone-cekirdek
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/phone/app/modules/eren-device/cekirdek
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # git yürütme biti kaybolmuş olabilir (Windows'ta eklenen dosya); her durumda güvenli
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Test
        run: ./gradlew test --no-daemon --console=plain
